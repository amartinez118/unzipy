name: Release to PyPI

# Publishing a GitHub release (tag v<version>) publishes to PyPI.
# Nothing is published unless lint, tests and the build all pass and the tag
# matches the version in pyproject.toml.
on:
  release:
    types: [published]
  workflow_dispatch:  # dry run: runs the checks, never publishes

permissions:
  contents: read

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # full history, for the secret scan
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Check tag matches package version
        run: |
          [ "${GITHUB_EVENT_NAME}" = "release" ] || exit 0
          v=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != version $v"; exit 1; }
      - run: uv sync --locked --extra dev --extra fast --python 3.12
      - run: uv run pre-commit run gitleaks-history --all-files --hook-stage manual
      - run: uv run pre-commit run --all-files
        env:
          SKIP: no-commit-to-branch,gitleaks  # gitleaks runs as its own step
      - run: uv run pytest -q
      - run: uv build && uvx twine check dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/

  pypi:
    name: Publish to PyPI
    needs: check
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing, no API token stored
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
