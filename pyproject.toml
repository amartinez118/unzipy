[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "unzipy"
version = "0.1.0.dev0"
description = "Single-molecule force spectroscopy and nonequilibrium statistical physics: polymer elasticity, fluctuation theorems, unzipping analysis."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["single-molecule", "force spectroscopy", "optical tweezers", "fluctuation theorems", "free energy", "DNA hairpin", "worm-like chain"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.10"
authors = [{ name = "Alvaro M Monge", email = "139244816+amartinez118@users.noreply.github.com" }]
dependencies = ["numpy>=2.0", "scipy>=1.13"]

[project.urls]
Homepage = "https://github.com/amartinez118/unzipy"
Issues = "https://github.com/amartinez118/unzipy/issues"
Changelog = "https://github.com/amartinez118/unzipy/blob/main/CHANGELOG.md"

[project.scripts]
unzipy = "unzipy.cli:main"

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
fast = ["numba>=0.58"]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.5"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "examples", "README.md", "LICENSE", "CHANGELOG.md", "CONTRIBUTING.md", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/unzipy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 79
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "D"]
ignore = ["E741"]  # `l` is the physics symbol for relative extension

[tool.ruff.lint.pycodestyle]
max-doc-length = 79

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"examples/*" = ["D"]
