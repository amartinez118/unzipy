name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --extra dev --python 3.12
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest -q
      - run: uv build && uvx twine check dist/*
