repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, main]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-ast
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: name-tests-test
        args: [--pytest-test-first]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep in sync with the ruff version in uv.lock.
    rev: v0.17.3
    hooks:
      # Linter, including the Google-style docstring rules (pydocstyle "D").
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false
      - id: uv-lock-check
        name: uv-lock-check
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      # Scans staged changes for API keys, tokens, passwords and the like.
      - id: gitleaks
      # Whole-history scan, used by the release workflow (the gitleaks
      # action does not support the release event).
      - id: gitleaks
        alias: gitleaks-history
        name: Detect hardcoded secrets (full history)
        entry: gitleaks git --redact --verbose
        stages: [manual]
