name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Linux covers the supported Python range; macOS (scarce runners) one version
        include:
          - { os: ubuntu-latest, python: "3.10", extras: "dev" }
          - { os: ubuntu-latest, python: "3.12", extras: "dev" }
          - { os: ubuntu-latest, python: "3.13", extras: "dev" }
          - { os: ubuntu-latest, python: "3.12", extras: "dev,fast" }  # numba code path
          - { os: macos-latest, python: "3.12", extras: "dev" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -e ".[${{ matrix.extras }}]"
      - run: ruff check . && ruff format --check .
      - run: pytest -q
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install build twine
      - run: python -m build && twine check dist/*
