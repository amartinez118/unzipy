name: Lint, test and build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # manual dry run from the Actions tab

permissions:
  contents: read
  pull-requests: read  # lets the secret scan list a PR's commits

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # full history, for the secret scan
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: uv sync --locked --extra dev --extra fast --python 3.12
      - run: uv run pre-commit run --all-files
        env:
          SKIP: no-commit-to-branch,gitleaks  # gitleaks runs as its own step
      - run: uv run pytest -q
      - run: uv build && uvx twine check dist/*
